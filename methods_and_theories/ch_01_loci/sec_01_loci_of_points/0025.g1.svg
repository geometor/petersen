<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 273" width="400" height="273" class="euclid-graphic" data-graphic-id="0025.g1" data-folio="0025" data-graphic="g1">
  <title>Petersen Locus h — Constant Difference of Squares &amp; Radical Axis (1879, p. 9)</title>
  <style>
:root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line, .geom-circle, .geom-curve, .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux {
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dotted {
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 2.2, 2.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      font-style: italic;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sub { font-size: 10px; font-weight: 700; }
    .geom-overlay { opacity: 0; pointer-events: none; transition: opacity 0.12s ease; }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-active * {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    circle.geom-point.geom-highlight-active, .geom-point:hover {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active { opacity: 1 !important; stroke: var(--geom-assert) !important; }
    path.geom-assert-active.geom-tick-1 { marker-mid: url(#geom-tick-1); }
    path.geom-assert-active.geom-tick-2 { marker-mid: url(#geom-tick-2); }
    path.geom-assert-active.geom-tick-3 { marker-mid: url(#geom-tick-3); }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
  </defs>
  <g id="elements">
  </g>
  <g id="graphics">
    <path id="el-seg-AB" data-ref="/ A B /" data-type="segment" fill="none" class="geom-line" d="M 58 240 L 213 240 L 368 240" />
    <path id="el-line-PD" data-ref="[ P D ]" data-type="line" fill="none" class="geom-line" d="M 191 240 L 191 124 L 191 8" />
    <path id="el-seg-PA" data-ref="/ P A /" data-type="segment" fill="none" class="geom-dashed" d="M 191 71 L 124.5 155.5 L 58 240" />
    <path id="el-seg-PB" data-ref="/ P B /" data-type="segment" fill="none" class="geom-dashed" d="M 191 71 L 279.5 155.5 L 368 240" />
    <path id="el-seg-P1A" data-ref="/ P1 A /" data-type="segment" fill="none" class="geom-dotted" d="M 191 165 L 124.5 202.5 L 58 240" />
    <path id="el-seg-P1B" data-ref="/ P1 B /" data-type="segment" fill="none" class="geom-dotted" d="M 191 165 L 279.5 202.5 L 368 240" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-seg-AB" data-ref="/ A B /" fill="none" class="geom-line geom-overlay" d="M 58 240 L 213 240 L 368 240" />
    <path id="hl-line-PD" data-ref="[ P D ]" fill="none" class="geom-line geom-overlay" d="M 191 240 L 191 124 L 191 8" />
    <path id="hl-seg-PA" data-ref="/ P A /" fill="none" class="geom-dashed geom-overlay" d="M 191 71 L 124.5 155.5 L 58 240" />
    <path id="hl-seg-PB" data-ref="/ P B /" fill="none" class="geom-dashed geom-overlay" d="M 191 71 L 279.5 155.5 L 368 240" />
    <path id="hl-seg-P1A" data-ref="/ P1 A /" fill="none" class="geom-dotted geom-overlay" d="M 191 165 L 124.5 202.5 L 58 240" />
    <path id="hl-seg-P1B" data-ref="/ P1 B /" fill="none" class="geom-dotted geom-overlay" d="M 191 165 L 279.5 202.5 L 368 240" />
  </g>
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="58" cy="240" r="2.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="191" cy="240" r="2.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="368" cy="240" r="2.2" class="geom-point" />
    <circle id="el-pt-P1" data-ref="P1" data-type="point" cx="191" cy="165" r="2.2" class="geom-point" />
    <circle id="el-pt-P" data-ref="P" data-type="point" cx="191" cy="71" r="2.2" class="geom-point" />
  </g>
  <g id="labels">
    <text id="lbl-A" data-ref="A" x="42" y="247" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-D" data-ref="D" x="175" y="224" text-anchor="end" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="377" y="247" text-anchor="start" class="geom-label">B</text>
    <text id="lbl-P1" data-ref="P1" x="175" y="166" text-anchor="end" class="geom-label">P<tspan class="geom-label-sub" dy="3">1</tspan></text>
    <text id="lbl-P" data-ref="P" x="178" y="72" text-anchor="end" class="geom-label">P</text>
  </g>
</svg>
