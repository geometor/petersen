    <text id="lbl-C" data-ref="C" x="162" y="175" text-anchor="middle" class="geom-label">C</text>
    <text id="lbl-B" data-ref="B" x="217" y="175" text-anchor="middle" class="geom-label">B</text>
    <text id="lbl-C1" data-ref="C1" x="366" y="175" text-anchor="middle" class="geom-label">C<tspan class="geom-label-sub" dy="3">1</tspan></text>
    <text id="lbl-P" data-ref="P" x="253" y="30" text-anchor="middle" class="geom-label">P</text>
