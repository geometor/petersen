    <path id="el-seg-PB" data-ref="/ P B /" data-type="segment" fill="none" class="geom-dotted" d="M 253 44 L 237.5 96.5 L 222 149" />
    <path id="el-seg-PC1" data-ref="/ P C1 /" data-type="segment" fill="none" class="geom-dotted" d="M 253 44 L 310.5 96.5 L 368 149" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-arc-CC1" data-ref="( M C )" fill="none" class="geom-arc geom-overlay" d="M 161 149 A 103.5 103.5 0 0 1 368 149" />
    <path id="hl-seg-AB" data-ref="/ A B /" fill="none" class="geom-line geom-overlay" d="M 53 149 L 137.5 149 L 222 149" />
    <path id="hl-seg-BC1" data-ref="/ B C1 /" fill="none" class="geom-dotted geom-overlay" d="M 222 149 L 295 149 L 368 149" />
    <path id="hl-seg-PA" data-ref="/ P A /" fill="none" class="geom-dashed geom-overlay" d="M 253 44 L 153 96.5 L 53 149" />
    <path id="hl-seg-PC" data-ref="/ P C /" fill="none" class="geom-dotted geom-overlay" d="M 253 44 L 207 96.5 L 161 149" />
    <path id="hl-seg-PB" data-ref="/ P B /" fill="none" class="geom-dotted geom-overlay" d="M 253 44 L 237.5 96.5 L 222 149" />
