<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 358" width="400" height="358" class="euclid-graphic" data-graphic-id="0107.g1" data-folio="0107" data-graphic="g1">
  <title>Petersen Problem 387 — Equal Tangent Ratio Locus for Intersecting Circles (1879, p. 91)</title>
  <style>
:root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line, .geom-circle, .geom-curve, .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux {
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dotted {
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 2.2, 2.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.04;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      font-style: italic;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sub { font-size: 10px; font-weight: 700; }
    .geom-overlay { opacity: 0; pointer-events: none; transition: opacity 0.12s ease; }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active, text.geom-highlight-active * {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    circle.geom-point.geom-highlight-active, .geom-point:hover {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active { opacity: 1 !important; stroke: var(--geom-assert) !important; }
    path.geom-assert-active.geom-tick-1 { marker-mid: url(#geom-tick-1); }
    path.geom-assert-active.geom-tick-2 { marker-mid: url(#geom-tick-2); }
    path.geom-assert-active.geom-tick-3 { marker-mid: url(#geom-tick-3); }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
  </defs>
  <g id="elements">
    <circle id="el-circ-O1" data-ref="( O1 A )" data-type="circle" cx="127.5" cy="225.5" r="104.5" fill="none" class="geom-circle" />
    <circle id="el-circ-O2" data-ref="( O2 A )" data-type="circle" cx="271.5" cy="223" r="99.5" fill="none" class="geom-circle" />
  </g>
  <g id="graphics">
    <path id="el-seg-MB" data-ref="/ M B /" data-type="segment" fill="none" class="geom-line" d="M 262 24 L 230.5 160.5 L 199 297" />
    <path id="el-seg-AD" data-ref="/ A D /" data-type="segment" fill="none" class="geom-dotted" d="M 197 151 L 209.5 167.5 L 222 184" />
    <path id="el-seg-AE" data-ref="/ A E /" data-type="segment" fill="none" class="geom-dotted" d="M 197 151 L 216.5 140.5 L 236 130" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circ-O1" data-ref="( O1 A )" cx="127.5" cy="225.5" r="104.5" fill="none" class="geom-circle geom-overlay" />
    <circle id="hl-circ-O2" data-ref="( O2 A )" cx="271.5" cy="223" r="99.5" fill="none" class="geom-circle geom-overlay" />
    <path id="hl-seg-MB" data-ref="/ M B /" fill="none" class="geom-line geom-overlay" d="M 262 24 L 230.5 160.5 L 199 297" />
    <path id="hl-seg-AD" data-ref="/ A D /" fill="none" class="geom-dotted geom-overlay" d="M 197 151 L 209.5 167.5 L 222 184" />
    <path id="hl-seg-AE" data-ref="/ A E /" fill="none" class="geom-dotted geom-overlay" d="M 197 151 L 216.5 140.5 L 236 130" />
  </g>
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="197" cy="151" r="2.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="199" cy="297" r="2.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="222" cy="184" r="2.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="236" cy="130" r="2.2" class="geom-point" />
    <circle id="el-pt-M" data-ref="M" data-type="point" cx="262" cy="24" r="2.2" class="geom-point" />
  </g>
  <g id="labels">
    <text id="lbl-M" data-ref="M" x="240" y="36" text-anchor="end" class="geom-label">M</text>
    <text id="lbl-A" data-ref="A" x="184" y="130" text-anchor="end" class="geom-label">A</text>
    <text id="lbl-E" data-ref="E" x="245" y="150" text-anchor="start" class="geom-label">E</text>
    <text id="lbl-D" data-ref="D" x="228" y="198" text-anchor="start" class="geom-label">D</text>
    <text id="lbl-B" data-ref="B" x="192" y="328" text-anchor="middle" class="geom-label">B</text>
  </g>
